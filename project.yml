name: GitDock

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  Stable: release

packages:
  GitDockCore:
    path: Packages/GitDockCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  GitDock:
    type: application
    platform: macOS
    sources:
      - path: GitDock
        excludes:
          - Resources/Info.plist
      - path: docs/agent-chat.md
        buildPhase: resources
      - path: scripts/review-chat-adapter.py
        buildPhase: resources
    dependencies:
      - package: GitDockCore
      - package: Sparkle
        product: Sparkle
      - target: GitDockWorkspaceCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikovert.githubbar
        PRODUCT_NAME: GitDock
        INFOPLIST_FILE: GitDock/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: GitDock/Resources/GitDock.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GITHUBBAR_SPARKLE_FEED_URL: ""
        GITHUBBAR_SPARKLE_PUBLIC_KEY: ""
      configs:
        Stable:
          CODE_SIGN_STYLE: Manual
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GITHUBBAR_STABLE"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
  GitDockWorkspaceCLI:
    type: tool
    platform: macOS
    sources:
      - path: Packages/GitDockCore/CLI/GitDockWorkspaceCLI
    dependencies:
      - package: GitDockCore
        product: GitDockCore
    settings:
      base:
        PRODUCT_NAME: GitDockWorkspaceCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.nikovert.githubbar.workspace-cli
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Stable:
          CODE_SIGN_STYLE: Manual
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
  GitDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GitDockTests
    dependencies:
      - target: GitDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikovert.githubbar.tests

schemes:
  GitDock:
    build:
      targets:
        GitDock: all
        GitDockTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GitDockTests
    archive:
      config: Stable
